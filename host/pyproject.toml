[project]
name = "host"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "aiosqlite>=0.22.1",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "llvmlite>=0.42.0",
    "loguru>=0.7.3",
    "numba>=0.59.0",
    "numpy<2.0.0",
    "openai-whisper>=20250625",
    "pyaudio>=0.2.14",
    "setuptools>=83.0.0",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "transformers<4.41.0",
    "tts==0.22.0",
    "webrtcvad>=2.0.10",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "torchcodec>=0.15.0",
    "yt-dlp>=2026.7.4",
    "mujoco>=3.10.0",
    "sounddevice>=0.5.5",
    "pillow>=12.3.0",
    "open3d>=0.19.0",
]

[dependency-groups]
dev = [
    "pyaudio>=0.2.14",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

