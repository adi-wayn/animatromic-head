; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.2
    bblanchon/ArduinoJson @ ^7.0.4
    tzapu/WiFiManager @ ^2.0.17
monitor_speed = 115200
extra_scripts = pre:../protocol/generate_protocol.py
build_flags =
    ; Enable ESP-IDF dynamic CPU frequency scaling (80–240 MHz)
    -D CONFIG_PM_ENABLE=1
    ; Enable FreeRTOS Tickless Idle → automatic Light Sleep when all tasks are blocked
    -D CONFIG_FREERTOS_USE_TICKLESS_IDLE=1
    ; Minimum idle ticks before entering Light Sleep (3 ticks ≈ 3ms at 1kHz tick rate)
    -D CONFIG_FREERTOS_IDLE_TIME_BEFORE_SLEEP=3


